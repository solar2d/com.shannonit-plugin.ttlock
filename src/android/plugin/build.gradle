plugins {
    id 'com.android.library'
}

android {
    namespace "plugin.ttlock"
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0" 
    }

    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
        // 防止在发布的时候出现因MissingTranslation导致Build Failed!
        disable 'MissingTranslation'
    }
    //添加本地仓库，并把libs目录作为仓库地址
    repositories {
        flatDir {
            dirs 'libs'
        }
    }
    
}

dependencies {
    //implementation fileTree(include: ['*.aar'], dir: 'libs')
    //implementation(name: 'ttlock-sdk-2.0.0', ext: 'aar')
    implementation(name: 'Corona', ext: 'aar')
    compileOnly files('libs/jnlua-1.0.4.jar')
    // implementation "androidx.annotation:annotation:1.6.0"

    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
//    testImplementation 'junit:junit:4.12'
//    implementation(name: 'ttlock-release-3.0.7', ext: 'aar')
    implementation 'no.nordicsemi.android:dfu:2.5.0'
//    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
//    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'
    implementation 'com.google.code.gson:gson:2.6.2'
    implementation 'com.ttlock:ttlock:3.5.4'
    implementation 'com.squareup.retrofit2:retrofit:2.4.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.4.0'
}

import org.gradle.api.tasks.bundling.Tar
import org.gradle.api.tasks.bundling.Compression

// ---- Variables ----
def pluginId = android.namespace
def solar2DVersion = "2025.3721"

def aarFile = file("$buildDir/outputs/aar/$project.name-release.aar")
def includeDir = file("$projectDir/../../package-plugin")
def outputDir = file("$projectDir/../../../plugins/$solar2DVersion/android")
def tmpDir = file("$buildDir/tmp/pluginPackage")

// ---- Task: Prepare Plugin Files ----
tasks.register("preparePluginFiles", Copy) {
    dependsOn "assembleRelease"

    // Clean tmpDir before copying
    doFirst {
        delete tmpDir
        tmpDir.mkdirs()
    }

    // Copy everything from includeDir
    from(includeDir)
    into(tmpDir)

    // Copy & rename AAR into tmpDir
    from(aarFile) {
        rename { "${pluginId}.aar" }
    }
    into(tmpDir)

    doLast {
        println "Copied files to tmpDir:"
        fileTree(tmpDir).visit { println it.relativePath }
    }
}

// ---- Task: Package into TGZ ----
tasks.register("preparePluginPackage", Tar) {
    group = "Solar2Dev"
    description = "Build Solar2D plugin package (AAR + data.tgz)"

    dependsOn "preparePluginFiles"

    archiveFileName.set("data.tgz")
    destinationDirectory.set(outputDir)
    compression = Compression.GZIP

    // Include everything from tmpDir
    from { tmpDir } {
        include "**/*"
    }

    doLast {
        println "== Solar2D plugin package created =="
        println "Plugin: $pluginId"
        println "Output: $outputDir/data.tgz"
    }
}
