plugins {
    id 'com.android.library'
}

android {
    namespace 'plugin.ttlock'
    compileSdkVersion 33
    defaultConfig {
        namespace 'plugin.ttlock'
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }


    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
        // compilerArgs << "-Xlint:deprecation"
    }
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
        // 防止在发布的时候出现因MissingTranslation导致Build Failed!
        disable 'MissingTranslation'
    }
    //添加本地仓库，并把libs目录作为仓库地址
    repositories {
        flatDir {
            dirs 'libs'
        }
    }
}


dependencies {
    //implementation fileTree(include: ['*.aar'], dir: 'libs')
    //implementation(name: 'ttlock-sdk-2.0.0', ext: 'aar')
    implementation(name: 'Corona', ext: 'aar')
    implementation(name:'ttlock-3.5.4', ext:'aar') {
        transitive = true
    }
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
//    testImplementation 'junit:junit:4.12'
//    implementation(name: 'ttlock-release-3.0.7', ext: 'aar')
    implementation 'no.nordicsemi.android:dfu:2.5.0'
//    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
//    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'
    implementation 'com.google.code.gson:gson:2.6.2'
    // implementation 'com.ttlock:ttlock:3.5.4'
    implementation 'com.squareup.retrofit2:retrofit:2.4.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.4.0'
}

import org.gradle.api.tasks.bundling.Tar
import org.gradle.api.tasks.bundling.Compression

// ---- Variables ----
def pluginId = android.namespace
def solar2DVersion = "2025.3722"

def aarFile = file("$buildDir/outputs/aar/$project.name-release.aar")
//def aarFile = file("$buildDir/intermediates/aar_main_jar/release/classes.jar")
def includeDir = file("$projectDir/../../package-plugin/lua")
def pluginsDir = file("$projectDir/../../../plugins/$solar2DVersion/android") // raw files
def tmpDir = file("$buildDir/tmp/pluginPackage")                             // temp folder
def tgzOutputDir = file("$buildDir/outputs/pluginPackage")                   // data.tgz output


def ttlockClassesDir = file("$projectDir/../../android/plugin/package-plugin/ttlock_classes")

tasks.register("mergeTTLockClasses") {
    dependsOn "assembleRelease"
    doLast {
        if (!ttlockClassesDir.exists()) {
            println "TTLock classes folder not found: $ttlockClassesDir"
            return
        }

        def aarPath = file("$buildDir/outputs/aar/$project.name-release.aar")
        if (!aarPath.exists()) {
            println "AAR not found: $aarPath"
            return
        }

        println "Merging TTLock classes into plugin AAR..."

        // Unzip AAR into temp folder
        def tempDir = file("$buildDir/tmp/aarMerge")
        delete tempDir
        tempDir.mkdirs()
        copy {
            from zipTree(aarPath)
            into tempDir
        }

        // Merge TTLock classes into classes.jar
        def classesJar = file("$tempDir/classes.jar")
        if (!classesJar.exists()) {
            // If classes.jar doesn't exist, create one
            ant.jar(destfile: classesJar)
        }

        ant.zip(destfile: classesJar, basedir: ttlockClassesDir, update: true)

        // Repack the AAR
        def mergedAar = file("$buildDir/outputs/aar/${project.name}-release.aar")
        ant.zip(destfile: mergedAar) {
            fileset(dir: tempDir)
        }

        println "TTLock classes merged successfully!"
    }
}

// ---- Task: Prepare Plugin Files ----
tasks.register("preparePluginFiles", Copy) {
    dependsOn "mergeTTLockClasses"

    doFirst {
        delete tmpDir
        tmpDir.mkdirs()
    }

    // Copy everything from includeDir into tmpDir
    from(includeDir)
    into(tmpDir)

    // Copy & rename AAR into tmpDir
    from(aarFile) {
        rename { "${pluginId.replace('.', '-')}.aar" }
    }

    into(tmpDir)

    doLast {
        println "Copied files to tmpDir:"
        fileTree(tmpDir).visit { println it.relativePath }
    }
}

// ---- Task: Copy raw files into plugins/.../android ----
tasks.register("deployPluginFiles", Copy) {
    dependsOn "preparePluginFiles"

    from(tmpDir)
    into(pluginsDir)

    doLast {
        println "Raw plugin files copied to plugins dir:"
        fileTree(pluginsDir).visit { println it.relativePath }
    }
}

// ---- Task: Package into TGZ (kept in outputs) ----
tasks.register("preparePluginPackage", Tar) {
    group = "Solar2Dev"
    description = "Build Solar2D plugin package (AAR + data.tgz)"

    dependsOn "deployPluginFiles"

    archiveFileName.set("data.tgz")
    destinationDirectory.set(tgzOutputDir)
    compression = Compression.GZIP

    // Include everything from tmpDir
    from { tmpDir } {
        include "**/*"
    }

    doLast {
        println "== Solar2D plugin package created =="
        println "Plugin: $pluginId"
        println "TGZ output: $tgzOutputDir/data.tgz"
    }
}


// Optional: high-level task to do everything
tasks.register("buildPlugin") {
    group = "Solar2Dev"
    description = "Prepare plugin files, deploy raw files, and package tgz"
    dependsOn "mergeTTLockClasses", "preparePluginFiles", "deployPluginFiles", "preparePluginPackage"
}
