

plugins {
    id 'com.android.library'
}

android {
    namespace "plugin.ttlock"
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }

    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
        // 防止在发布的时候出现因MissingTranslation导致Build Failed!
        disable 'MissingTranslation'
    }
    //添加本地仓库，并把libs目录作为仓库地址
    repositories {
        flatDir {
            dirs 'libs'
        }
    }
    
}

dependencies {
    //implementation fileTree(include: ['*.aar'], dir: 'libs')
    // implementation(name: 'jnlua-1.0.4', ext: 'jar')
    implementation(name: 'Corona', ext: 'aar')
    // implementation "androidx.annotation:annotation:1.6.0"

    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
//    testImplementation 'junit:junit:4.12'
//    implementation(name: 'ttlock-release-3.0.7', ext: 'aar')
    implementation 'no.nordicsemi.android:dfu:2.5.0'
//    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
//    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'
    implementation 'com.google.code.gson:gson:2.6.2'
    implementation 'com.ttlock:ttlock:3.5.4'
    implementation 'com.squareup.retrofit2:retrofit:2.4.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.4.0'
}



import org.gradle.api.tasks.bundling.Compression
import org.gradle.api.tasks.bundling.Tar

def providerId = 'com.solar2d'
def solar2DVersion = '2015.2539' 
def pluginNamespace = android.namespace


tasks.register("buildPluginJarFromAAR", Jar) {
    group = "Solar2Dev"

    // Where the AAR exists
    def aarFile = file("$buildDir/outputs/aar/${project.name}-release.aar")

    // Extraction working folder
    def tmpDir = file("$buildDir/tmp/pluginJarWork")
    def classesDir = file("$tmpDir/allClasses")

    // Output JAR name
    archiveBaseName.set(pluginNamespace)
    destinationDirectory.set(file("$buildDir/outputs"))

    dependsOn "assembleRelease"

    doFirst {
        delete tmpDir
        tmpDir.mkdirs()
        classesDir.mkdirs()

        // ---- Extract classes.jar from AAR ----
        copy {
            from(zipTree(aarFile))
            include "classes.jar"
            into tmpDir
        }

        // ---- Unzip classes.jar into allClasses ----
        copy {
            from(zipTree("$tmpDir/classes.jar"))
            into classesDir
        }
    }

    // ---- Build JAR from extracted classes ----
    from(classesDir) {
        include "**/*.class"

        eachFile { f ->
            def seg = f.relativePath.segments as List
            def idx = seg.indexOf("plugin")
            if (idx != -1) {
                f.relativePath = new RelativePath(true, *seg[idx..-1])
            } else {
                f.exclude()
            }
        }
        includeEmptyDirs = false
    }

    doLast {
        def jarPath = "$buildDir/outputs/${pluginNamespace}.jar"

        // Local Solar2D plugin path
        def rootS2DP = System.env.APPDATA ?: System.env.HOME
        def solar2DPath = file("$rootS2DP/Solar2DPlugins/$providerId/$pluginNamespace/android")

        // Additional folder: plugins/<version>/android
        def additionalPath = file("$projectDir/../../../plugins/$solar2DVersion/android")

        // Copy to Solar2D local repository
        copy {
            from(jarPath)
            into solar2DPath
        }

        // Copy to plugins/<version>/android
        copy {
            from(jarPath)
            into additionalPath
        }

        println "== JAR built from AAR =="
        println "== Copied to: $solar2DPath =="
        println "== Also copied to: $additionalPath =="
    }
}
