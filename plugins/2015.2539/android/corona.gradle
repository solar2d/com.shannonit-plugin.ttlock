android {
    defaultConfig {
        // Ensure minimum SDK version is at least 23
        minSdkVersion Math.max(minSdkVersion?.apiLevel ?: 15, 23)
    }
}

// Save minSdkVersion in ext if needed by Solar2D build scripts
ext["minSdkVersion"] = Math.max(ext.find("minSdkVersion") ?: 15, 23)

dependencies {
    // Core dependencies for the plugin
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation "androidx.browser:browser:1.8.0"
    implementation 'com.ttlock:ttlock:3.5.4'
    implementation 'com.squareup.retrofit2:retrofit:2.4.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.4.0'
    implementation 'com.google.code.gson:gson:2.6.2'
    implementation 'no.nordicsemi.android:dfu:2.5.0'
}
